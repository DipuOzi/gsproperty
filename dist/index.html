 and we'll arrange an initial conversation about current and upcoming projects.",formNote:"Whether you're considering active involvement or a more hands-off partnership, we'll explain how we work and answer your questions."},{id:"landlord",number:"02",title:"Landlords",navLabel:"Landlords",selectorLabel:"I'm a Landlord",icon:Zg,panelCopy:"Explore property management, portfolio solutions, or options for moving on from rental ownership.",panelCta:"For Landlords",image:cl(9620508,900,1250),imageAlt:"Brick apartment building with balconies in warm daylight",formIntro:"Tell us about your property or portfolio and what you'd like to change — management, a sale, or planning an exit.",formNote:"Tired landlords, tenanted properties and whole portfolios can all be discussed. There's no commitment at this stage."},{id:"owner",number:"03",title:"Property Owners",navLabel:"Property Owners",selectorLabel:"I Want to Sell a Property",icon:Qg,panelCopy:"Considering selling? Discuss your property and explore a potential route that suits your circumstances.",panelCta:"For Property Owners",image:cl(39060777,900,1250),imageAlt:"Red-brick house with a bay window on a quiet residential street",formIntro:"Share a few details about your property and your preferred timescale, and we'll talk through the options available.",formNote:"Residential and commercial property considered, including homes that need refurbishment. We'll explain every step clearly."},{id:"landowner",number:"04",title:"Landowners",navLabel:"Landowners",selectorLabel:"I Own Land",icon:Vg,panelCopy:"Discover how a development partnership could help you explore your land's potential.",panelCta:"For Landowners",image:cl(31125307,900,1250),imageAlt:"Aerial view of green fields and farmland in the English countryside",formIntro:"Tell us where your land is and anything you know about its current status, and we'll discuss whether it may have development potential.",formNote:"A development partnership can allow you to explore pote nts:["Professional property management for single properties and portfolios","Selling with tenants in place — no need to wait for vacant possession","Phased portfolio sales structured around your plans, including retirement","A clear comparison of managing versus selling, with no obligation either way"],caption:"Management and portfolio solutions for single properties and portfolios",primaryCta:"Explore Landlord Solutions",secondaryCta:"Discuss My Property",imageFirst:!0,tone:"parchment",image:hu(1571460),imageAlt:"Bright, well-kept living room interior with natural daylight"},{id:"owner",sectionId:"property-owners",number:"03",eyebrow:"For Property Owners",headingPlain:"A direct, considered",headingAccent:"route to selling",copy:"If you own a house, flat, HMO or commercial property in Birmingham or the West Midlands, we may be able to buy directly from you — including properties that need work. No viewings treadmill, no chain, and no estate-agent fees when you sell to us. We will explain exactly what is possible, and what is not, before you commit to anything.",points:["Houses, flats, HMOs and commercial property all considered","Properties needing refurbishment — we buy to renovate and develop","Buy directly from you, cutting out middlemen and agent fees","Time-sensitive circumstances discussed openly, with clear next steps"],caption:"Residential and commercial property considered across the region",primaryCta:"Explore My Selling Options",secondaryCta:"Request a Property Discussion",tone:"cream",image:hu(39060777),imageAlt:"Residential street with parked cars in the West Midlands"},{id:"landowner",sectionId:"landowners",number:"04",eyebrow:"For Landowners",headingPlain:"Explore your",headingAccent:"land's potential",headingTail:"— without funding the development",copy:"You do not need to fund or manage a development to find out what your land could achieve. Through a development partnership with GS Property Group, we can assess your land, explore planning and design with appropriately qualified professionals, and — subject to agreed terms — you would not need to fund the development upfront or carry the development risk yourself.",points:["Land with or without planning permission considered","Development partnerships with no upfront development funding from you, subject to agreed terms","Delivery through qualified professionals, including RICS, FMB and RIBA-affiliated partners","A straightforward first assessment — just tell us where the land is"],caption:"Land with or without planning permission considered",primaryCta:"Discuss My Land",secondaryCta:"Explore Development Partnerships",tone:"dark",imageFirst:!0,image:hu(1642125),imageAlt:"Aerial view of a housing development surrounded by greenery"}],Jy=[{question:"What types of property projects does GS Property Group work with?",answer:"Our work spans commercial units, commercial-to-residential refurbishment projects, conversions to HMOs and apartments, and the development of new property. We specialise in property sourcing, refurbishment and property management across Birmingham and the West Midlands, and every project is assessed against our core principles of location, the property itself, and tenant or covenant strength."},{question:"How can I explore a property investment or joint venture?",answer:"Start with a conversation. We work with local, national and international investors, as well as funds and lenders interested in joint venture opportunities — whether as an active or a more passive partner. Share your investment interests and, if you wish, an indicative budget through our enquiry form, and we'll explain how our partnerships work and discuss whether any current projects may be suitable. Returns are never guaranteed, and we'll always be open about the risks involved."},{question:"Can you help landlords who want to sell their rental properties?",answer:"Yes. If you've reached the point where managing rental property no longer suits you — whether because of changing legislation, retirement plans, or simply wanting your time back — we can discuss purchasing your property or portfolio directly, including properties with tenants in place. We can also talk through property management if you'd prefer to keep ownership. The right route depends on your circumstances, which is why we always start with a discussion."},{question:"Can I discuss selling a property that needs refurbishment?",answer:"Absolutely. Refurbishment is one of our core specialisms, so a property that needs work is not a barrier to a conversation. We consider residential and commercial property across Birmingham and the West Midlands, and because you would be dealing with us directly, there are no estate agency chains to manage. Tell us about the property and your timescale, and we'll explain the options clearly."},{question:"Can landowners explore development partnerships without funding the development themselves?",answer:"In many cases, yes. A development partnership can allow you to explore your land's potential without funding or managing the development personally, subject to the site's suitability and agreed terms. We consider development land with or without planning permission. Share the location and approximate size of your land and we'll give you an honest view of whether it may have potential."},{question:"What information should I provide when making an enquiry?",answer:"Just the essentials: your contact details and a brief outline of your situation. Investors may find it helpful to mention their interests and an indicative budget; landlords, the location and number of properties; sellers, the property type and preferred timescale; landowners, the land's location, approximate size and planning status if known. The more relevant detail you share, the more useful our first conversation can be — but nothing beyond the basics is required."},{question:"Am I committing to anything by contacting GS Property Group?",answer:"No. An enquiry simply starts a conv
